app = "enzoaraujo-portfolio"
primary_region = "ams"

[build]
  # Relative to this file, which is also the build context.
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # The chat is bursty: the machine sleeps between conversations and wakes on
  # the next request. Cold start costs a few seconds of langchain imports.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # langgraph + langchain + fastapi import to well over 256 MB; 512 MB leaves
  # no headroom for a streaming request on top.
  memory = "1gb"
